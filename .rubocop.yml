plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Include:
    - "bin/*"
  inherit_mode:
    merge:
      - Include
  Exclude:
    - "reference/**/*"
    - "vendor/**/*"
    - "out/**/*"
    - "scripts/**/*"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 100
