name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: make check

      - run: make validate

      # Недетерминированный движок даёт невоспроизводимые цифры на защите.
      # Ловим здесь, а не за час до стопкода.
      - run: make determinism

      - name: no randomness in decision path
        run: make no-random
