# Доли по деньгам вместо долей по числу заявок. Осмысленно, когда договорённость
# звучит как «половина оборота», а не «половина заявок»: десять чеков по тысяче
# и один на десять тысяч — одинаковый объём при десятикратной разнице в счёте.
strategy: volume_share
layers: [share_ceiling]
goals:
  share_ceiling: { tolerance_bp: 0 }
fallback_provider: spacepayments
