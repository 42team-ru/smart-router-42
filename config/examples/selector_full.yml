# Селектор стратегий — справочник по всем возможностям.
#
#   bundle exec bin/route reference/data/operations_queue_10.json \
#     --config config/examples/selector_full.yml
#
# Селектор отвечает на вопрос «какой стратегией ранжировать ИМЕННО ЭТУ заявку».
# Слои учитывают несколько целей одновременно, селектор переключает логику по
# контексту заявки — это разные механизмы, и они сочетаются.
#
# Правила намеренно видят только текущую заявку и уже допущенных кандидатов.
# Заглядывать в будущие операции очереди нельзя: обработка онлайновая, каждая
# заявка получает свой снимок состояния.

strategy: count_share          # используется, если strategy_selection не задан
layers: []
fallback_provider: spacepayments

# ─────────────────────────────────────────────────────────────────────────────
# ПРЕДИКАТЫ: всё, что можно написать в `when`
#
#   amount_gte:         целое   сумма заявки >= значения
#   amount_lt:          целое   сумма заявки <  значения
#   bank_in:            список  банк заявки входит в перечень
#   eligible_count_lte: целое   допущенных провайдеров <= значения
#
# Других предикатов нет. Незнакомый ключ — ошибка на загрузке конфига, а не
# тихо проигнорированное правило.
#
# ВНУТРИ одного `when` условия соединяются через И — совпасть должны все.
# МЕЖДУ правилами выигрывает ПЕРВОЕ совпавшее, а не самое точное: порядок в
# этом списке значим, специфичные правила пишутся выше общих.
# ─────────────────────────────────────────────────────────────────────────────

strategy_selection:
  # Стратегия, когда не совпало ни одно правило. Необязателен: без него берётся
  # верхнеуровневый ключ strategy.
  default: count_share

  rules:
    # ── 1. Комбинация двух предикатов через И ────────────────────────────────
    # Совпасть должны ОБА условия: и сумма, и банк. Правило стоит первым, потому
    # что оно самое узкое — правила ниже перехватили бы эти заявки раньше.
    # Срабатывает на op_103 (150 000 ₽, sberbank).
    - when:
        amount_gte: 100000
        bank_in: [sberbank, tinkoff]
      use: conversion
      why: "крупная сумма в массовый банк — приоритет проходимости"

    # ── 2. bank_in ───────────────────────────────────────────────────────────
    # Банк, где у провайдеров разная договорная стоимость: пусть маршрут решают
    # полосы сумм из amount_ranges. Срабатывает на op_102 и op_110 (alfa).
    - when: { bank_in: [alfa] }
      use: amount_range
      why: "для alfa маршрут задаётся полосами суммы"

    # ── 3. amount_lt ─────────────────────────────────────────────────────────
    # Мелкие переводы дёшевы и многочисленны — ими удобно выравнивать доли по
    # деньгам, не рискуя крупными суммами. Срабатывает на op_104 и op_107.
    - when: { amount_lt: 5000 }
      use: volume_share
      why: "мелкая сумма — выравниваем доли по обороту"

    # ── 4. eligible_count_lte ────────────────────────────────────────────────
    # Единственный предикат, который смотрит не на заявку, а на результат
    # допуска. Допущен один провайдер — любая умная стратегия выродится в него
    # же, берём самую дешёвую. Срабатывает на op_108.
    - when: { eligible_count_lte: 1 }
      use: priority
      why: "выбора нет, каскад тривиален"

    # ── 5. amount_gte ────────────────────────────────────────────────────────
    # Не попали в правило 1 (другой банк или сумма меньше), но заявка всё равно
    # крупная: бережём загруженных, чтобы не собрать очередь на одном.
    # Срабатывает на op_106.
    - when: { amount_gte: 40000 }
      use: load
      why: "крупная операция — к менее загруженному провайдеру"

# Полосы для правила 2 (стратегия amount_range берёт их отсюда).
amount_ranges:
  - { from: 500, to: 50000, prefer: payflow }
  - { from: 50001, to: 100000, prefer: vipay }
  - { from: 100001, to: null, prefer: quickpay }

outcomes:
  source: deterministic
  seed: 42
  calibrate_from_history: true

obligations:
  payflow: { daily_turnover_min: 2000000 }
  vipay: { daily_turnover_max: 5000000 }

rate_limits:
  vipay: 7
  quickpay: 15
