# Селектор: все четыре предиката в работе.
#
#   bundle exec bin/route reference/data/operations_queue_10.json \
#     --config config/examples/selector_full.yml
#
# Предикаты в `when`:
#   amount_gte          сумма >= значения
#   amount_lt           сумма <  значения
#   bank_in             банк входит в список
#   eligible_count_lte  допущенных провайдеров <= значения
#
# Внутри одного `when` — И, все условия обязаны совпасть.
# Между правилами выигрывает первое совпавшее, поэтому узкие идут выше общих.
# Порядок ниже подобран так, чтобы на публичной очереди сработало каждое.

strategy: count_share
layers: []
fallback_provider: spacepayments

strategy_selection:
  default: count_share
  rules:
    - when:                                  # op_103: два условия сразу
        amount_gte: 100000
        bank_in: [sberbank, tinkoff]
      use: conversion
      why: "крупная сумма в массовый банк — приоритет проходимости"

    - when: { bank_in: [alfa] }              # op_102, op_110
      use: amount_range
      why: "для alfa маршрут задаётся полосами суммы"

    - when: { amount_lt: 5000 }              # op_104, op_107
      use: volume_share
      why: "мелкая сумма — выравниваем доли по обороту"

    - when: { eligible_count_lte: 1 }        # op_108: смотрит на итог допуска
      use: priority
      why: "выбора нет, каскад тривиален"

    - when: { amount_gte: 40000 }            # op_106
      use: load
      why: "крупная операция — к менее загруженному провайдеру"

amount_ranges:
  - { from: 500, to: 50000, prefer: payflow }
  - { from: 50001, to: 100000, prefer: vipay }
  - { from: 100001, to: null, prefer: quickpay }

outcomes:
  source: deterministic
  seed: 42
  calibrate_from_history: true

obligations:
  payflow: { daily_turnover_min: 2000000 }
  vipay: { daily_turnover_max: 5000000 }

rate_limits:
  vipay: 7
  quickpay: 15
