# Демонстрация буквального прочтения ТЗ: обе альтернативные ветки каскада
# включены разом -- exhausted: fallback_provider (исчерпанный каскад
# подхватывает spacepayments) и on_timeout: continue (таймаут не останавливает
# каскад, резерв держится и попытки продолжаются). Боевой конфиг
# (config/routing.yml) держит противоположные дефолты -- exhausted:
# last_candidate, on_timeout: stop -- ровно потому что этот файл с ним больше
# НЕ совпадает: буквальное прочтение ТЗ на op_103/op_104 подставляет
# spacepayments вместо quickpay, чего требует
# reference/data/reference_decisions.json, и валит `make validate`. Этот файл
# существует, чтобы показать, что буквальная трактовка доступна и рабочая --
# не для боевого прогона.
#
# Замер на публичной очереди: на seed 42 единственный допустимый кандидат на
# op_103 и op_104 (quickpay) отвечает таймаутом -- on_timeout: continue здесь
# двигает каскад дальше и подключает spacepayments; в боевом конфиге
# on_timeout: stop останавливается на quickpay. Это свойство данных
# конкретной очереди, а не гарантия кода.
strategy: count_share
layers: []

goals:
  budget_headroom: { activates_at_spent_pct: 90 }
  share_ceiling: { tolerance_bp: 0 }

outcomes:
  source: deterministic
  seed: 42
  calibrate_from_history: true

amount_ranges:
  - { from: 500, to: 50000, prefer: payflow }
  - { from: 50001, to: 100000, prefer: vipay }
  - { from: 100001, to: null, prefer: quickpay }

obligations:
  payflow: { daily_turnover_min: 2000000 }
  vipay: { daily_turnover_max: 5000000 }

rate_limits:
  vipay: 7
  payflow: 10
  quickpay: 15

cascade:
  exhausted: fallback_provider
  on_timeout: continue

fallback_provider: spacepayments
