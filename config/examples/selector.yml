strategy: count_share
layers: []

goals:
  budget_headroom: { activates_at_spent_pct: 90 }
  share_ceiling: { tolerance_bp: 0 }

strategy_selection:
  default: count_share
  rules:
    - when: { amount_gte: 40000 }
      use: load
      why: "крупная операция направляется к менее загруженному провайдеру"
    - when: { eligible_count_lte: 1 }
      use: priority
      why: "выбора нет, каскад тривиален"

outcomes:
  source: deterministic
  seed: 42
  calibrate_from_history: true

amount_ranges:
  - { from: 500, to: 50000, prefer: payflow }
  - { from: 50001, to: 100000, prefer: vipay }
  - { from: 100001, to: null, prefer: quickpay }

obligations:
  payflow: { daily_turnover_min: 2000000 }
  vipay: { daily_turnover_max: 5000000 }

rate_limits:
  vipay: 7
  quickpay: 15

fallback_provider: spacepayments
