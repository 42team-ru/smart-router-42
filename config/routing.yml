# Конфигурация роутинга. Схема и валидация — Config::Loader (lib/config/loader.rb, CFG-1).
#
# Файл читает bin/route на старте, один раз, и передаёт объектом в
# Routing::Assembly (CFG-2). Смена ключа strategy здесь меняет распределение без
# правок кода. Флаг --strategy перекрывает ключ strategy; путь к самому файлу
# меняется флагом --config.
#
# Влияют сегодня: strategy, strategy_selection, outcomes, amount_ranges (при
# strategy: amount_range), fallback_provider, включённые слои, obligations
# (daily_turnover_min/max, П1), rate_limits (requests_per_minute_limit, П2 --
# docs/plans/P6/P2_rate_limit.md) и cascade (исчерпание каскада и таймаут,
# П7 -- docs/plans/P6/P7_настраиваемый_fallback.md). Оба override накладываются
# поверх data/providers.json, где эти поля уже реальны; CLI предупреждает
# только на снапшотах, где поля действительно отсутствуют (например,
# пристинном reference/data/providers.json).

strategy: count_share
layers: [] # боевой выбор: ψ-слой меняет целевое распределение

# Пороги целей для слоёв (lib/routing/layers). Инертны, пока layers пуст.
goals:
  budget_headroom: { psi_threshold_micro: 100000 } # ψ = 0.100
  share_ceiling: { tolerance_bp: 0 }

outcomes:
  source: deterministic
  seed: 42
  calibrate_from_history: true

amount_ranges:
  - { from: 500, to: 50000, prefer: payflow }
  - { from: 50001, to: 100000, prefer: vipay }
  - { from: 100001, to: null, prefer: quickpay }

obligations:
  payflow: { daily_turnover_min: 2000000 }
  vipay: { daily_turnover_max: 5000000 }

rate_limits:
  vipay: 7
  payflow: 10
  quickpay: 15

# П7: обе трактовки ТЗ доступны переключателем, дефолты — сегодняшнее
# поведение (записаны явно, а не подразумеваются молчаливым отсутствием ключа).
#   exhausted: last_candidate (дефолт) | fallback_provider
#   on_timeout: stop (дефолт) | continue
# Альтернативные значения ломают детерминированные кейсы валидатора на
# публичной очереди (см. таблицу «Замеры» в docs/plans/P6/P7_настраиваемый_fallback.md)
# — в боевом прогоне не менять.
cascade:
  exhausted: last_candidate
  on_timeout: stop

fallback_provider: spacepayments

# П4 (docs/plans/P6/P4_сравнение.md): офлайн-сравнение baseline (round_robin)
# против боевой стратегии (count_share) и против count_share+слои. Постфактум
# -- идёт только в консоль и в routing_report_test.json (секция comparison),
# никогда в принятие решений (spec/offline/isolation_spec.rb, spec/offline/comparison_spec.rb).
# Ровно один вариант обязан буквально совпадать с боевыми strategy/layers выше
# (сейчас это count_share) -- иначе SchemaError при загрузке конфига: таблица
# без опоры на фактический прогон бессмысленна.
comparison:
  - { name: round_robin,        strategy: round_robin, layers: [] }
  - { name: count_share,        strategy: count_share, layers: [] }
  - { name: count_share+layers, strategy: count_share, layers: [budget_headroom, share_ceiling] }
