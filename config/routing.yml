# Боевой конфиг: по нему идут `make deliver`, `make validate` и все демо.
# Держится коротким намеренно. Построчные обоснования — config/routing.annotated.yml
# (тот же набор значений, спек следит, чтобы файлы не разъехались).

history_path: reference/data/operations_history.csv

strategy: count_share
layers: []

goals:
  budget_headroom: { activates_at_spent_pct: 90 }
  share_ceiling: { tolerance_bp: 0 }

outcomes:
  source: always_ok # указание организаторов: на тестовой очереди всё approved
  seed: 42
  calibrate_from_history: true
  smoothing: true

amount_ranges:
  - { from: 500, to: 50000, prefer: payflow }
  - { from: 50001, to: 100000, prefer: vipay }
  - { from: 100001, to: null, prefer: quickpay }

cascade:
  exhausted: last_candidate
  on_timeout: stop

fallback_provider: spacepayments

pending_resolution:
  enabled: true

offline_analytics:
  max_operations: 10000

comparison:
  - { name: round_robin,        strategy: round_robin, layers: [] }
  - { name: count_share,        strategy: count_share, layers: [] }
  - { name: count_share+layers, strategy: count_share, layers: [budget_headroom, share_ceiling] }
