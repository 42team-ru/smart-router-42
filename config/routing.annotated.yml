# Аннотированная копия боевого config/routing.yml: те же значения, но с
# обоснованием каждого ключа. Нужна для защиты и для того, кто впервые видит
# конфиг, — боевой файл держится коротким, чтобы в час стопкода в нём было
# видно значения, а не прозу.
#
# ЗНАЧЕНИЯ ОБЯЗАНЫ СОВПАДАТЬ с config/routing.yml — за этим следит
# spec/config/annotated_parity_spec.rb: файлы загружаются оба и сравниваются
# по разобранному конфигу, а не по тексту. Меняете боевой — поправьте здесь.
#
# Прогонять можно и по нему: `bundle exec bin/route <queue> --config
# config/routing.annotated.yml` даст побайтово тот же результат.
#
# Схема и валидация — Config::Loader. Приоритет: флаг CLI > файл > дефолт.
# Устройство модулей — docs/ARCHITECTURE.md, регламент сдачи — docs/RUNBOOK.md.

# Калибровка по истории операций. Отсюда берутся пороги исходов для
# deterministic, порядок кандидатов в стратегии conversion и расхождение
# «паспортная conversion_24h против факта» в рекомендациях отчёта.
# Файл читает bin/route один раз на старте — стратегии к диску не обращаются.
history_path: reference/data/operations_history.csv

# Активная стратегия ранжирования. count_share — метод делителей Сент-Лагю
# (Уэбстера), которым распределяют места в парламентах: раздать N дискретных
# единиц по заданным долям. На публичной очереди попадает в достижимую долю
# точно (0.0 п.п. отклонения у всех трёх), см. docs/ARCHITECTURE.md §8.
# Остальные семь: volume_share, priority, amount_range, conversion, load,
# obligations, round_robin — переключаются этой одной строкой.
strategy: count_share

# Слои-модификаторы поверх порядка от стратегии. Порядок существенен:
# share_ceiling идёт первым, чтобы не допускать перебора доли до экономии бюджета.
layers: [share_ceiling, budget_headroom]

# Пороги слоёв. Инертны, пока слой не включён в layers выше, но comparison
# гоняет вариант count_share+layers, и там они работают.
goals:
  # BALANCE из задачи AdWords: чем больше дневного лимита истрачено, тем
  # дороже оставшийся рубль. Порог — с какой доли расхода придерживать.
  budget_headroom: { activates_at_spent_pct: 90 }
  # Середина устойчивого плато 700..1200 бп, измеренного на боевой очереди.
  share_ceiling: { tolerance_bp: 1000 }

outcomes:
  # Источник исходов попытки. always_ok — прямое указание организаторов
  # (уточнено 2026-09-06): на тестовой очереди все операции должны быть
  # approved, отказы и таймауты у них идут как дополнительный функционал.
  #
  # Цена: в сдаваемом JSON не остаётся ни одного отказа, а значит и
  # доказательства каскада с fallback. Механика никуда не делась — показывать
  # её надо этими командами (docs/RUNBOOK.md §2):
  #   --config config/examples/scripted_cascade.yml   (op_101: vipay → payflow)
  #   --outcomes deterministic --seed 42              (8/1/1, ретрай на op_106)
  #
  # Прочие источники: deterministic (боевой в обычной ситуации — хеш от seed),
  # scripted (исход каждой пары задан явно), always_fail (для тестов каскада).
  source: always_ok

  # seed и calibrate_from_history под always_ok на результат не влияют:
  # одобряется всё подряд, таблица исходов не спрашивается. Но они задают
  # поведение демо-прогона `--outcomes deterministic`, а он у нас показывается
  # на защите. Проверено: с calibrate_from_history: false тот же прогон уводит
  # op_106 в quickpay вместо vipay — то есть демо каскада меняется.
  #
  # Исход = SHA256(seed:operation_id:provider:attempt_no) % 10000, сравнённый
  # с порогами провайдера. Чистая функция, поэтому прогон воспроизводим и
  # контрфактуалы для benchmark вычислимы.
  seed: 42
  calibrate_from_history: true

  # Сглаживание оценок approved/rejected/expired к общему среднему (Дирихле,
  # эффективный размер приора k выведен из данных методом моментов, k ≈ 11.39).
  # Включено, потому что у payflow 19 наблюдений и 95% интервал Уилсона для его
  # конверсии — примерно [0.27, 0.68], шире всего разброса между провайдерами.
  # Это эмпирический Байес (partial pooling), а не обучение модели: запрет
  # нейросетей из ТЗ не задевает.
  # Влияет на текст рекомендаций: «сглаженная оценка 0.759, k=11.4» против
  # «наблюдаемая 0.781» при false.
  smoothing: true

# Полосы сумм для стратегии amount_range (ТЗ, стратегия 4: «по сумме чека»).
# Влияют на ПОРЯДОК среди допущенных, а не отсекают — отсечение по сумме делает
# hard-constraint AmountRange, это разные механизмы.
amount_ranges:
  - { from: 500, to: 50000, prefer: payflow }
  - { from: 50001, to: 100000, prefer: vipay }
  - { from: 100001, to: null, prefer: quickpay }

# Поведение каскада. ТЗ читается двояко, поэтому доступны обе трактовки:
#   exhausted: last_candidate (дефолт) | fallback_provider
#   on_timeout: stop (дефолт) | continue
#
# Дефолты держатся на факте, а не на вкусе: reference_decisions.json требует
# quickpay на op_103 и op_104, где единственный допустимый кандидат отвечает
# таймаутом. Любая из двух замен увела бы каскад на spacepayments и завалила
# `make validate` (проверено: config/examples/tz_literal.yml даёт 2 ошибки).
#
# По существу таймаут — «результат неизвестен», а не «отказ»: отправка той же
# операции следующему провайдеру рискует двойной выплатой. Резерв держится
# (State#hold) и закрывается статус-чеком, а не повторной попыткой.
cascade:
  exhausted: last_candidate
  on_timeout: stop

# Self-provider, подхватывающий заявку, для которой никто не прошёл допуск.
fallback_provider: spacepayments

# Поздний статус-чек вторым проходом после всей очереди. Без него hold держит
# слот in_progress до конца прогона, и на длинной очереди ёмкость проседает
# необратимо — InProgress и Requisites читают живые счётчики, а не снапшот.
# Решения не переписывает, только добавляет секцию pending_resolution в отчёт.
#
# ВАЖНО под always_ok: таймаутов не возникает, холдов нет, и секция выходит
# нулевой (checked: 0, used_before == used_after). Это не поломка — это
# честное «закрывать было нечего». Оставлено включённым сознательно: под
# deterministic механизм отрабатывает по-настоящему (op_103: холд разрешён в
# approved, освобождено 150 000 ₽, утилизация quickpay 14.3% → 16.2%), и
# выключать рабочий механизм ради отсутствия нулей в отчёте незачем.
# false — секции в отчёте нет вовсе, оба файла побайтово как до механизма.
pending_resolution:
  enabled: true

# Порог размера очереди для дорогой офлайн-аналитики (оракул и comparison):
# на 100 000 операций эта пара стоит ~20 с из ~29 с прогона. Выше порога обе
# секции не считаются, и отчёт несёт пометку в benchmark.status — пропуск не
# молчит. Принудительно — флаг --offline-analytics.
offline_analytics:
  max_operations: 10000

# Офлайн-сравнение стратегий: идёт только в консоль и в секцию comparison
# отчёта, в принятие решений не входит (spec/offline/isolation_spec.rb).
# Ровно один вариант обязан совпадать с боевыми strategy/layers выше, иначе
# SchemaError при загрузке: таблице нужна опора на фактический прогон.
#
# Блок держится последним: спеки обрезают его регуляркой «до конца файла».
comparison:
  - { name: round_robin,        strategy: round_robin, layers: [] }
  - { name: count_share,        strategy: count_share, layers: [] }
  - { name: count_share+layers, strategy: count_share, layers: [share_ceiling, budget_headroom] }
